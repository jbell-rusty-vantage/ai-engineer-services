# Environment variables read by ai-engineer-service (names only; never values). Database block first.
# Values: BellLabs/.secrets/aieng-db.env. Source of the database block of .env.example and docs/ENVIRONMENT.md.
# Local by default: the dev/start scripts load only the git-ignored .env.lab (loopback lab); a remote needs AIENG_DB_REMOTE_CONFIRM.
# The only reader of the database block is packages/application/src/config.ts; callers use the resolved ServiceConfig. No aliases.
variables:
  - name: AIENG_DB_URL
    description: API origin of the AI Engineer Supabase project (https://<ref>.supabase.co) or the lab stack's loopback URL; origin only, no path.
    kind: url
    secret: false
    plane: AIENG
    role: URL
    status: active
    readers:
      - packages/application/src/config.ts:70
      - scripts/lab/lab-environment.ts:26
  - name: AIENG_DB_PUBLISHABLE_KEY
    description: Public API key sent as apikey together with the caller's own session token.
    kind: key
    secret: false
    plane: AIENG
    role: PUBLISHABLE_KEY
    status: active
    readers:
      - packages/application/src/config.ts:86
      - scripts/lab/lab-environment.ts:35
  - name: AIENG_DB_SECRET_KEY
    description: Service key for byte custody (storage, complete_asset), product_worker and the release read at startup (api.database_release, which has no caller); server processes only, never forwarded to clients.
    kind: key
    secret: true
    plane: AIENG
    role: SECRET_KEY
    status: active
    readers:
      - packages/application/src/config.ts:87
      - scripts/lab/lab-environment.ts:36
  - name: AIENG_DB_PROJECT_REF
    description: Supabase project ref; must appear in the AIENG_DB_URL host (startup refuses AIENG_DB_PROJECT_REF_MISMATCH). Optional only when AIENG_DB_URL is loopback (lab).
    kind: identifier
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: active
    readers:
      - packages/application/src/config.ts:72
  - name: AIENG_DB_REMOTE_CONFIRM
    description: The explicit choice of a remote database. Local by default; a non-loopback AIENG_DB_URL is refused (REMOTE_DATABASE_NOT_CONFIRMED) unless this names the same project ref as AIENG_DB_PROJECT_REF. Set it in the process environment for one run; never in .env.lab.
    kind: identifier
    secret: false
    plane: AIENG
    role: REMOTE_CONFIRM
    status: active
    readers:
      - packages/application/src/config.ts:78
  - name: AIENG_DB_RELEASE_CHECK
    description: How the API and the remote MCP server treat the database's release when they start. enforce (default) asks api.database_release() and refuses to start (AIENG_DB_RELEASE_REFUSED) unless the release is in the service's range, the version of the pinned contract package; warn asks, logs the verdict and starts; off does not ask. Any other value, an empty one included, refuses when the configuration loads. The name is the database contract's, shared with Knowledge Services and Mission Control.
    kind: mode
    secret: false
    plane: AIENG
    role: RELEASE_CHECK
    status: active
    default: enforce
    readers:
      - packages/application/src/config.ts:46

# Service and client variables (not database; no secret values in this repository either).
# Server processes: apps/api, apps/mcp remote. Clients: apps/cli, apps/mcp stdio, scripts/lab, scripts/consumer-surface-eval.ts.
service_variables:
  - name: AIENG_API_HOST
    description: Bind host of the HTTP API.
    kind: host
    secret: false
    default: 127.0.0.1
    readers:
      - apps/api/src/index.ts:11
  - name: AIENG_API_PORT
    description: Bind port of the HTTP API.
    kind: port
    secret: false
    default: "3200"
    readers:
      - apps/api/src/index.ts:12
  - name: AIENG_MCP_HOST
    description: Bind host of the remote (streamable HTTP) MCP server.
    kind: host
    secret: false
    default: 127.0.0.1
    readers:
      - apps/mcp/src/remote.ts:11
  - name: AIENG_MCP_PORT
    description: Bind port of the remote MCP server.
    kind: port
    secret: false
    default: "3201"
    readers:
      - apps/mcp/src/remote.ts:12
  - name: AIENG_API_URL
    description: Base URL of the HTTP API used by out-of-process clients. Required by the CLI and the local MCP server; the lab proof defaults to http://127.0.0.1:3200.
    kind: url
    secret: false
    readers:
      - apps/cli/src/main.ts:53
      - apps/mcp/src/stdio.ts:14
      - scripts/lab/prove-surfaces.ts:61
  - name: AIENG_ACCESS_TOKEN
    description: The calling user's own Supabase session access token. Required by the CLI and the local MCP server; the consumer evaluation uses it instead of creating a lab user.
    kind: token
    secret: true
    readers:
      - apps/cli/src/main.ts:54
      - apps/mcp/src/stdio.ts:15
      - scripts/consumer-surface-eval.ts:184
  - name: AIENG_CLIENT_TOKEN
    description: Optional scoped client grant minted with create_client_grant.
    kind: token
    secret: true
    readers:
      - apps/cli/src/main.ts:55
      - apps/mcp/src/stdio.ts:12
  - name: AIENG_SCHEMA_WORKSPACE_DIR
    description: Directory of the generated schema workspace of ai-engineer-db-contract (its workspace/ folder), read by the API and the remote MCP server for schema navigation. Files only; no database call.
    kind: path
    secret: false
    default: ../ai-engineer-db-contract/workspace (the sibling checkout, when it exists)
    readers:
      - packages/application/src/schema/schema-workspace-location.ts:28
