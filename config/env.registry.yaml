# Environment variables read by ai-engineer-service (names only; never values). Database block first.
# Values: BellLabs/.secrets/aieng-db.env. Source of the database block of .env.example and docs/ENVIRONMENT.md.
# The only reader of the database block is packages/application/src/config.ts; callers use the resolved ServiceConfig. No aliases.
variables:
  - name: AIENG_DB_URL
    description: API origin of the AI Engineer Supabase project (https://<ref>.supabase.co) or the lab stack's loopback URL; origin only, no path.
    kind: url
    secret: false
    plane: AIENG
    role: URL
    status: active
    readers:
      - packages/application/src/config.ts:35
      - scripts/lab/lab-environment.ts:27
  - name: AIENG_DB_PUBLISHABLE_KEY
    description: Public API key sent as apikey together with the caller's own session token.
    kind: key
    secret: false
    plane: AIENG
    role: PUBLISHABLE_KEY
    status: active
    readers:
      - packages/application/src/config.ts:45
      - scripts/lab/lab-environment.ts:28
  - name: AIENG_DB_SECRET_KEY
    description: Service key for byte custody (storage, complete_asset) and product_worker; server processes only, never forwarded to clients.
    kind: key
    secret: true
    plane: AIENG
    role: SECRET_KEY
    status: active
    readers:
      - packages/application/src/config.ts:46
      - scripts/lab/lab-environment.ts:29
  - name: AIENG_DB_PROJECT_REF
    description: Supabase project ref; must appear in the AIENG_DB_URL host (startup refuses AIENG_DB_PROJECT_REF_MISMATCH). Optional only when AIENG_DB_URL is loopback (lab).
    kind: identifier
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: active
    readers:
      - packages/application/src/config.ts:37

# Service and client variables (not database; no secret values in this repository either).
# Server processes: apps/api, apps/mcp remote. Clients: apps/cli, apps/mcp stdio, scripts/lab.
service_variables:
  - name: AIENG_API_HOST
    description: Bind host of the HTTP API.
    kind: host
    secret: false
    default: 127.0.0.1
    readers:
      - apps/api/src/index.ts:4
  - name: AIENG_API_PORT
    description: Bind port of the HTTP API.
    kind: port
    secret: false
    default: "3200"
    readers:
      - apps/api/src/index.ts:5
  - name: AIENG_MCP_HOST
    description: Bind host of the remote (streamable HTTP) MCP server.
    kind: host
    secret: false
    default: 127.0.0.1
    readers:
      - apps/mcp/src/remote.ts:4
  - name: AIENG_MCP_PORT
    description: Bind port of the remote MCP server.
    kind: port
    secret: false
    default: "3201"
    readers:
      - apps/mcp/src/remote.ts:5
  - name: AIENG_API_URL
    description: Base URL of the HTTP API used by out-of-process clients. Required by the CLI and the local MCP server; the lab proof defaults to http://127.0.0.1:3200.
    kind: url
    secret: false
    readers:
      - apps/cli/src/main.ts:28
      - apps/mcp/src/stdio.ts:13
      - scripts/lab/prove-surfaces.ts:56
  - name: AIENG_ACCESS_TOKEN
    description: The calling user's own Supabase session access token. Required by the CLI and the local MCP server.
    kind: token
    secret: true
    readers:
      - apps/cli/src/main.ts:29
      - apps/mcp/src/stdio.ts:14
  - name: AIENG_CLIENT_TOKEN
    description: Optional scoped client grant minted with create_client_grant.
    kind: token
    secret: true
    readers:
      - apps/cli/src/main.ts:30
      - apps/mcp/src/stdio.ts:11
